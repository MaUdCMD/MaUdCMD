<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Code</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.7.0/highlight.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .selection-screen {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            padding: 20px;
        }
        
        .selection-title {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            color: #8a2be2;
            text-align: center;
            text-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }
        
        .selection-subtitle {
            font-size: 1rem;
            margin-bottom: 2rem;
            color: #aaa;
            text-align: center;
        }
        
        .editors-selection {
            display: flex;
            gap: 20px;
            margin-bottom: 3rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .editor-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            border: 2px solid #333;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #2d2d2d;
            width: 150px;
        }
        
        .editor-option:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        .editor-option.selected {
            border-color: #8a2be2;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.7);
            background: rgba(138, 43, 226, 0.1);
        }
        
        .editor-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: #8a2be2;
        }
        
        .editor-name {
            font-size: 1.2rem;
            font-weight: bold;
        }
        
        .continue-btn {
            padding: 12px 40px;
            background: #8a2be2;
            color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }
        
        .continue-btn:hover {
            background: #6a1bb5;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.8);
            transform: scale(1.05);
        }
        
        .continue-btn:disabled {
            background: #666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }
        
        .editor-screen {
            display: none;
            flex-direction: column;
            height: 100vh;
            background: #1a1a1a;
        }
        
        .editor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #2d2d2d;
            border-bottom: 2px solid #8a2be2;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.3);
        }
        
        .editor-title {
            font-size: 1.5rem;
            color: #8a2be2;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .line-search-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .line-search-input {
            padding: 8px 12px;
            background: #333;
            border: 1px solid #555;
            border-radius: 5px;
            color: #fff;
            font-size: 0.9rem;
            width: 150px;
        }
        
        .line-search-input::placeholder {
            color: #888;
        }
        
        .line-search-btn {
            padding: 8px 16px;
            background: #8a2be2;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }
        
        .line-search-btn:hover {
            background: #6a1bb5;
        }
        
        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            background: #ff4444;
            color: #fff;
            border-radius: 5px;
            font-weight: bold;
            box-shadow: 0 0 10px rgba(255, 68, 68, 0.5);
            z-index: 1000;
            opacity: 0;
            transform: translateX(100%);
            transition: all 0.3s ease;
        }
        
        .notification.show {
            opacity: 1;
            transform: translateX(0);
        }
        
        .editor-layout {
            display: flex;
            flex: 1;
            overflow: hidden;
        }
        
        .code-panel {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        
        .editor-tabs {
            display: flex;
            background: #2d2d2d;
            border-bottom: 1px solid #444;
            overflow-x: auto;
        }
        
        .editor-tab {
            padding: 12px 20px;
            background: #2d2d2d;
            border: none;
            color: #aaa;
            cursor: pointer;
            border-right: 1px solid #444;
            transition: all 0.2s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .editor-tab.active {
            background: #1a1a1a;
            color: #8a2be2;
            border-bottom: 2px solid #8a2be2;
        }
        
        .editor-container {
            flex: 1;
            display: none;
            position: relative;
        }
        
        .editor-container.active {
            display: block;
        }
        
        .editor-wrapper {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            bottom: 10px;
            display: flex;
            background: #1e1e1e;
            border: 2px solid #333;
            border-radius: 5px;
            overflow: hidden;
        }
        
        .line-numbers {
            background: #1e1e1e;
            color: #6a6a6a;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 21px;
            padding: 15px 8px 15px 15px;
            border-right: 1px solid #333;
            text-align: right;
            user-select: none;
            overflow: hidden;
            width: 60px;
            flex-shrink: 0;
        }
        
        .line-number {
            height: 21px;
            display: block;
        }
        
        .line-number.highlighted {
            background: rgba(138, 43, 226, 0.3);
            color: #8a2be2;
            font-weight: bold;
        }
        
        .editor-content {
            flex: 1;
            display: flex;
            position: relative;
            overflow: hidden;
        }
        
        .code-input-container {
            position: relative;
            flex: 1;
            overflow: auto;
        }
        
        .code-editor {
            width: 100%;
            height: 100%;
            background: transparent;
            color: transparent; /* Сделаем текст невидимым */
            border: none;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            resize: none;
            outline: none;
            line-height: 21px;
            tab-size: 4;
            caret-color: #fff;
            position: relative;
            z-index: 2;
            overflow: auto;
            white-space: pre;
        }
        
        .code-highlight {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: #1e1e1e;
            pointer-events: none;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            line-height: 21px;
            white-space: pre;
            overflow: hidden;
            z-index: 1;
        }
        
        .code-line {
            display: block;
            min-height: 21px;
        }
        
        .code-line.highlighted {
            background: rgba(138, 43, 226, 0.3) !important;
            animation: lineHighlight 4s ease-in-out;
        }
        
        @keyframes lineHighlight {
            0% { background: rgba(138, 43, 226, 0.8); }
            70% { background: rgba(138, 43, 226, 0.3); }
            100% { background: transparent; }
        }
        
        .editor-wrapper:focus-within {
            border-color: #8a2be2;
            box-shadow: 0 0 10px rgba(138, 43, 226, 0.5);
        }
        
        .clear-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4444;
            color: #fff;
            border: none;
            border-radius: 5px;
            padding: 8px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
            z-index: 4;
            transition: all 0.3s ease;
            opacity: 0;
        }
        
        .editor-wrapper:hover .clear-btn {
            opacity: 1;
        }
        
        .clear-btn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }
        
        .run-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 15px 30px;
            background: #8a2be2;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.7);
            z-index: 100;
        }
        
        .run-button:hover {
            background: #6a1bb5;
            box-shadow: 0 0 25px rgba(138, 43, 226, 0.9);
            transform: scale(1.05);
        }
        
        .preview-fullscreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            z-index: 1000;
            display: none;
        }
        
        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #2d2d2d;
            border-bottom: 2px solid #8a2be2;
        }
        
        .preview-title {
            font-size: 1.5rem;
            color: #8a2be2;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .console-btn {
            padding: 8px 16px;
            background: #8a2be2;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            font-size: 0.9rem;
        }
        
        .console-btn:hover {
            background: #6a1bb5;
        }
        
        .console-btn.active {
            background: #6a1bb5;
        }
        
        .close-preview {
            padding: 8px 16px;
            background: #8a2be2;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        
        .preview-content {
            display: flex;
            flex-direction: column;
            height: calc(100% - 60px);
        }
        
        .preview-frame {
            width: 100%;
            flex: 1;
            border: none;
            background: #fff;
        }
        
        .console-panel {
            background: #1e1e1e;
            border-top: 2px solid #8a2be2;
            display: none;
            flex-direction: column;
            height: 300px;
        }
        
        .console-panel.active {
            display: flex;
        }
        
        .console-header {
            padding: 10px 15px;
            background: #2d2d2d;
            color: #8a2be2;
            font-weight: bold;
            border-bottom: 1px solid #444;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .console-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        .console-filter {
            padding: 4px 8px;
            background: #333;
            border: 1px solid #555;
            border-radius: 3px;
            color: #fff;
            font-size: 0.8rem;
            width: 150px;
        }
        
        .console-levels {
            display: flex;
            gap: 5px;
        }
        
        .level-btn {
            padding: 4px 8px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.7rem;
            opacity: 0.6;
        }
        
        .level-btn.active {
            opacity: 1;
            background: #8a2be2;
        }
        
        .console-btn-small {
            padding: 4px 8px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .copy-console-btn {
            padding: 4px 8px;
            background: #444;
            color: #fff;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 0.8rem;
        }
        
        .console-output {
            flex: 1;
            padding: 10px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            background: #1a1a1a;
            white-space: pre-wrap;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }
        
        .console-line {
            margin: 2px 0;
            line-height: 1.4;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: text;
            user-select: text;
            -webkit-user-select: text;
            -moz-user-select: text;
            -ms-user-select: text;
        }
        
        .console-line:hover {
            background: #2a2a2a;
        }
        
        .console-timestamp {
            color: #666;
            font-size: 0.75rem;
            margin-right: 10px;
            user-select: none;
        }

        .console-log { color: #ffffff; }
        .console-error { color: #ff4444; }
        .console-warn { color: #ffaa00; }
        .console-info { color: #8888ff; }
        .console-debug { color: #888888; }

        .copy-notification {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #8a2be2;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            z-index: 1001;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .copy-notification.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="selection-screen" id="selectionScreen">
        <h1 class="selection-title">Какие редакторы вам нужны?</h1>
        <div class="selection-subtitle">можно выбрать несколько</div>
        <div class="editors-selection">
            <div class="editor-option" data-editor="html">
                <div class="editor-icon">{ }</div>
                <div class="editor-name">HTML</div>
            </div>
            <div class="editor-option" data-editor="css">
                <div class="editor-icon">#</div>
                <div class="editor-name">CSS</div>
            </div>
            <div class="editor-option" data-editor="js">
                <div class="editor-icon">( )</div>
                <div class="editor-name">JavaScript</div>
            </div>
        </div>
        <button class="continue-btn" id="continueBtn" disabled>Продолжить</button>
    </div>
    
    <div class="editor-screen" id="editorScreen">
        <div class="editor-header">
            <div class="editor-title">
                Start Code
                <div class="line-search-container">
                    <input type="text" class="line-search-input" id="lineSearchInput" placeholder="Номер строки" maxlength="4">
                    <button class="line-search-btn" id="lineSearchBtn">Найти</button>
                </div>
            </div>
        </div>
        <div class="editor-layout">
            <div class="code-panel">
                <div class="editor-tabs" id="editorTabs"></div>
                
                <div class="editor-container" id="html-editor">
                    <div class="editor-wrapper">
                        <div class="line-numbers" id="html-line-numbers">
                            <span class="line-number">1</span>
                        </div>
                        <div class="editor-content">
                            <div class="code-input-container">
                                <textarea class="code-editor" id="html-code" spellcheck="false" placeholder="Введите HTML код"></textarea>
                                <div class="code-highlight" id="html-highlight"></div>
                            </div>
                            <button class="clear-btn" data-editor="html">🗑️ Очистить</button>
                        </div>
                    </div>
                </div>
                
                <div class="editor-container" id="css-editor">
                    <div class="editor-wrapper">
                        <div class="line-numbers" id="css-line-numbers">
                            <span class="line-number">1</span>
                        </div>
                        <div class="editor-content">
                            <div class="code-input-container">
                                <textarea class="code-editor" id="css-code" spellcheck="false" placeholder="Введите CSS код"></textarea>
                                <div class="code-highlight" id="css-highlight"></div>
                            </div>
                            <button class="clear-btn" data-editor="css">🗑️ Очистить</button>
                        </div>
                    </div>
                </div>
                
                <div class="editor-container" id="js-editor">
                    <div class="editor-wrapper">
                        <div class="line-numbers" id="js-line-numbers">
                            <span class="line-number">1</span>
                        </div>
                        <div class="editor-content">
                            <div class="code-input-container">
                                <textarea class="code-editor" id="js-code" spellcheck="false" placeholder="Введите JavaScript код"></textarea>
                                <div class="code-highlight" id="js-highlight"></div>
                            </div>
                            <button class="clear-btn" data-editor="js">🗑️ Очистить</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <button class="run-button" id="runButton">Запустить</button>
    </div>
    
    <div class="preview-fullscreen" id="previewFullscreen">
        <div class="preview-header">
            <div class="preview-title">
                Результат
                <button class="console-btn" id="consoleToggle">Console</button>
            </div>
            <button class="close-preview" id="closePreview">Закрыть</button>
        </div>
        <div class="preview-content">
            <iframe class="preview-frame" id="preview"></iframe>
            <div class="console-panel" id="consolePanel">
                <div class="console-header">
                    Консоль
                    <div class="console-controls">
                        <input type="text" class="console-filter" id="consoleFilter" placeholder="Фильтр...">
                        <div class="console-levels">
                            <button class="level-btn active" data-level="all">All</button>
                            <button class="level-btn active" data-level="log">Log</button>
                            <button class="level-btn active" data-level="warn">Warn</button>
                            <button class="level-btn active" data-level="error">Error</button>
                            <button class="level-btn active" data-level="info">Info</button>
                            <button class="level-btn active" data-level="debug">Debug</button>
                        </div>
                        <button class="console-btn-small" id="clearConsole">Очистить</button>
                        <button class="copy-console-btn" id="copyConsole">Копировать</button>
                    </div>
                </div>
                <div class="console-output" id="consoleOutput"></div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification">Строка не найдена</div>
    <div class="copy-notification" id="copyNotification">Текст консоли скопирован!</div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Основные элементы
            const selectionScreen = document.getElementById('selectionScreen');
            const editorScreen = document.getElementById('editorScreen');
            const continueBtn = document.getElementById('continueBtn');
            const editorTabs = document.getElementById('editorTabs');
            const runButton = document.getElementById('runButton');
            const previewFullscreen = document.getElementById('previewFullscreen');
            const preview = document.getElementById('preview');
            const closePreview = document.getElementById('closePreview');
            const consoleToggle = document.getElementById('consoleToggle');
            const consolePanel = document.getElementById('consolePanel');
            const consoleOutput = document.getElementById('consoleOutput');
            const clearConsole = document.getElementById('clearConsole');
            const copyConsole = document.getElementById('copyConsole');
            const lineSearchInput = document.getElementById('lineSearchInput');
            const lineSearchBtn = document.getElementById('lineSearchBtn');
            const notification = document.getElementById('notification');
            const copyNotification = document.getElementById('copyNotification');

            // Состояние приложения
            const selectedEditors = { html: false, css: false, js: false };
            const consoleState = {
                logs: [],
                activeLevels: new Set(['all', 'log', 'warn', 'error', 'info', 'debug']),
                filterText: ''
            };

            // ПРАВИЛЬНЫЙ ПОДСЧЁТ СТРОК
            function updateLineNumbers(editorType) {
                const textarea = document.getElementById(editorType + '-code');
                const lineNumbers = document.getElementById(editorType + '-line-numbers');
                
                if (!textarea || !lineNumbers) return;

                const lines = textarea.value.split('\n');
                const lineCount = Math.max(1, lines.length);
                
                lineNumbers.innerHTML = '';
                
                for (let i = 1; i <= lineCount; i++) {
                    const lineNumber = document.createElement('span');
                    lineNumber.className = 'line-number';
                    lineNumber.textContent = i;
                    lineNumber.setAttribute('data-line-number', i);
                    lineNumbers.appendChild(lineNumber);
                }
            }

            // ИСПРАВЛЕННАЯ ИНИЦИАЛИЗАЦИЯ РЕДАКТОРОВ
            function initializeEditor(editorType) {
                const textarea = document.getElementById(editorType + '-code');
                const highlight = document.getElementById(editorType + '-highlight');
                
                if (!textarea || !highlight) return;

                // Функция обновления редактора
                const updateEditor = () => {
                    // Обновление нумерации строк
                    updateLineNumbers(editorType);
                    
                    // Подсветка синтаксиса
                    let code = textarea.value;
                    let highlightedCode = code;
                    
                    try {
                        if (editorType === 'html') {
                            highlightedCode = hljs.highlight(code, { language: 'xml' }).value;
                        } else if (editorType === 'css') {
                            highlightedCode = hljs.highlight(code, { language: 'css' }).value;
                        } else if (editorType === 'js') {
                            highlightedCode = hljs.highlight(code, { language: 'javascript' }).value;
                        }
                    } catch (e) {
                        // Если подсветка не сработала, используем обычный текст
                    }
                    
                    highlight.innerHTML = highlightedCode.split('\n')
                        .map(line => `<div class="code-line">${line || ' '}</div>`)
                        .join('');
                };

                // Обработчики событий
                textarea.addEventListener('input', updateEditor);
                
                textarea.addEventListener('scroll', () => {
                    highlight.scrollTop = textarea.scrollTop;
                    highlight.scrollLeft = textarea.scrollLeft;
                    const lineNumbers = document.getElementById(editorType + '-line-numbers');
                    if (lineNumbers) {
                        lineNumbers.scrollTop = textarea.scrollTop;
                    }
                });

                // УПРОЩЕННАЯ ОБРАБОТКА КЛАВИШ - только Tab
                textarea.addEventListener('keydown', function(e) {
                    if (e.key === 'Tab') {
                        e.preventDefault();
                        const start = this.selectionStart;
                        const end = this.selectionEnd;
                        
                        this.value = this.value.substring(0, start) + '    ' + this.value.substring(end);
                        this.selectionStart = this.selectionEnd = start + 4;
                        updateEditor();
                    }
                });

                // Инициализация
                updateEditor();
            }

            // ПРАВИЛЬНЫЙ ПОИСК СТРОКИ
            function searchLine() {
                const lineNumber = parseInt(lineSearchInput.value);
                
                if (isNaN(lineNumber) || lineNumber < 1) {
                    showNotification('Введите корректный номер строки');
                    return;
                }

                const activeTab = document.querySelector('.editor-tab.active');
                if (!activeTab) {
                    showNotification('Сначала выберите редактор');
                    return;
                }

                const editorType = activeTab.getAttribute('data-editor');
                const textarea = document.getElementById(editorType + '-code');
                const highlight = document.getElementById(editorType + '-highlight');
                const lineNumbers = document.getElementById(editorType + '-line-numbers');
                
                if (!textarea || !highlight || !lineNumbers) return;

                const lines = textarea.value.split('\n');
                
                if (lineNumber > lines.length) {
                    showNotification(`Строка ${lineNumber} не найдена. Всего строк: ${lines.length}`);
                    return;
                }

                // Сброс предыдущих выделений
                clearHighlights();

                // Выделение номера строки
                const lineNumberElement = lineNumbers.querySelector(`[data-line-number="${lineNumber}"]`);
                if (lineNumberElement) {
                    lineNumberElement.classList.add('highlighted');
                }

                // Выделение кода в строке
                const codeLines = highlight.querySelectorAll('.code-line');
                if (codeLines[lineNumber - 1]) {
                    codeLines[lineNumber - 1].classList.add('highlighted');
                }

                // Прокрутка к строке
                const lineHeight = 21;
                const scrollPosition = (lineNumber - 3) * lineHeight;
                
                textarea.scrollTop = Math.max(0, scrollPosition);
                highlight.scrollTop = Math.max(0, scrollPosition);
                lineNumbers.scrollTop = Math.max(0, scrollPosition);

                // Автоматическое снятие выделения через 4 секунды
                setTimeout(() => {
                    clearHighlights();
                }, 4000);

                showNotification(`Найдена строка ${lineNumber}`);
            }

            function clearHighlights() {
                // Сброс выделений во всех редакторах
                document.querySelectorAll('.line-number.highlighted').forEach(el => {
                    el.classList.remove('highlighted');
                });
                document.querySelectorAll('.code-line.highlighted').forEach(el => {
                    el.classList.remove('highlighted');
                });
            }

            function showNotification(message) {
                notification.textContent = message;
                notification.classList.add('show');
                setTimeout(() => notification.classList.remove('show'), 3000);
            }

            function showCopyNotification() {
                copyNotification.classList.add('show');
                setTimeout(() => copyNotification.classList.remove('show'), 2000);
            }

            // КОПИРОВАНИЕ ТЕКСТА ИЗ КОНСОЛИ
            function copyConsoleText() {
                const textToCopy = getConsoleText();
                if (textToCopy) {
                    navigator.clipboard.writeText(textToCopy).then(() => {
                        showCopyNotification();
                    }).catch(err => {
                        // Fallback для старых браузеров
                        const textArea = document.createElement('textarea');
                        textArea.value = textToCopy;
                        document.body.appendChild(textArea);
                        textArea.select();
                        document.execCommand('copy');
                        document.body.removeChild(textArea);
                        showCopyNotification();
                    });
                }
            }

            function getConsoleText() {
                let consoleText = '';
                consoleState.logs.forEach(log => {
                    if (!consoleState.activeLevels.has('all') && !consoleState.activeLevels.has(log.method)) {
                        return;
                    }
                    
                    if (consoleState.filterText && !log.args.join(' ').toLowerCase().includes(consoleState.filterText.toLowerCase())) {
                        return;
                    }

                    const timestamp = new Date(log.timestamp).toLocaleTimeString();
                    consoleText += `${timestamp} ${log.method.toUpperCase()}: ${log.args.join(' ')}\n`;
                });
                return consoleText.trim();
            }

            // ФИЛЬТРАЦИЯ КОНСОЛИ
            function updateConsole() {
                consoleOutput.innerHTML = '';
                
                const filteredLogs = consoleState.logs.filter(log => {
                    // Проверяем фильтр по типу сообщения
                    const levelMatch = consoleState.activeLevels.has('all') || consoleState.activeLevels.has(log.method);
                    
                    // Проверяем текстовый фильтр
                    const textMatch = !consoleState.filterText || 
                        log.args.join(' ').toLowerCase().includes(consoleState.filterText.toLowerCase());
                    
                    return levelMatch && textMatch;
                });

                filteredLogs.forEach(log => {
                    const line = document.createElement('div');
                    line.className = `console-line console-${log.method}`;
                    
                    const timestamp = new Date(log.timestamp).toLocaleTimeString();
                    const content = log.args.join(' ');
                    
                    line.innerHTML = `<span class="console-timestamp">${timestamp}</span> ${content}`;
                    consoleOutput.appendChild(line);
                });
                
                // Автопрокрутка к последнему сообщению
                consoleOutput.scrollTop = consoleOutput.scrollHeight;
            }

            // ИНИЦИАЛИЗАЦИЯ ФИЛЬТРОВ КОНСОЛИ
            function initializeConsoleFilters() {
                // Обработчики для кнопок фильтрации по уровням
                document.querySelectorAll('.level-btn').forEach(btn => {
                    btn.addEventListener('click', function() {
                        this.classList.toggle('active');
                        const level = this.getAttribute('data-level');
                        
                        if (this.classList.contains('active')) {
                            consoleState.activeLevels.add(level);
                        } else {
                            consoleState.activeLevels.delete(level);
                        }
                        
                        updateConsole();
                    });
                });

                // Обработчик для текстового фильтра
                document.getElementById('consoleFilter').addEventListener('input', function() {
                    consoleState.filterText = this.value;
                    updateConsole();
                });
            }

            // Выбор редакторов на начальном экране
            document.querySelectorAll('.editor-option').forEach(option => {
                option.addEventListener('click', function() {
                    const editor = this.getAttribute('data-editor');
                    selectedEditors[editor] = !selectedEditors[editor];
                    this.classList.toggle('selected');
                    continueBtn.disabled = !Object.values(selectedEditors).some(val => val);
                });
            });

            // Переход к редакторам
            continueBtn.addEventListener('click', function() {
                selectionScreen.style.display = 'none';
                editorScreen.style.display = 'flex';
                createEditorTabs();
                
                // Инициализация выбранных редакторов
                Object.keys(selectedEditors).forEach(editor => {
                    if (selectedEditors[editor]) {
                        initializeEditor(editor);
                    }
                });

                // Инициализация фильтров консоли
                initializeConsoleFilters();
            });

            // Создание вкладок редакторов
            function createEditorTabs() {
                editorTabs.innerHTML = '';
                
                ['html', 'css', 'js'].forEach(editor => {
                    if (selectedEditors[editor]) {
                        const tab = document.createElement('button');
                        tab.className = 'editor-tab';
                        tab.textContent = getEditorName(editor);
                        tab.setAttribute('data-editor', editor);
                        tab.addEventListener('click', function() {
                            // Активация вкладки
                            document.querySelectorAll('.editor-tab').forEach(t => t.classList.remove('active'));
                            document.querySelectorAll('.editor-container').forEach(c => c.classList.remove('active'));
                            this.classList.add('active');
                            document.getElementById(editor + '-editor').classList.add('active');
                        });
                        editorTabs.appendChild(tab);
                    }
                });
                
                // Активация первой вкладки
                const firstTab = editorTabs.querySelector('.editor-tab');
                if (firstTab) {
                    firstTab.click();
                }
            }

            function getEditorName(editor) {
                const names = { html: 'HTML', css: 'CSS', js: 'JavaScript' };
                return names[editor] || editor;
            }

            // Поиск строки
            lineSearchBtn.addEventListener('click', searchLine);
            lineSearchInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') searchLine();
            });

            // Запуск кода
            runButton.addEventListener('click', runCode);

            function runCode() {
                const htmlCode = selectedEditors.html ? document.getElementById('html-code').value : '';
                const cssCode = selectedEditors.css ? document.getElementById('css-code').value : '';
                const jsCode = selectedEditors.js ? document.getElementById('js-code').value : '';

                const previewDoc = preview.contentDocument || preview.contentWindow.document;
                
                // Очистка консоли
                consoleState.logs = [];
                updateConsole();

                const fullHtml = `
<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        ${cssCode}
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    ${htmlCode || '<div style="text-align: center; padding: 50px; color: #666;">Напишите HTML код</div>'}
    <script>
        // Перехват консоли
        (function() {
            const originalConsole = {
                log: console.log,
                error: console.error,
                warn: console.warn,
                info: console.info,
                debug: console.debug
            };

            const sendToConsole = (method, args) => {
                try {
                    window.parent.postMessage({
                        type: 'console',
                        method: method,
                        args: Array.from(args).map(arg => {
                            if (typeof arg === 'object' && arg !== null) {
                                try {
                                    return JSON.stringify(arg, null, 2);
                                } catch (e) {
                                    return String(arg);
                                }
                            }
                            return String(arg);
                        })
                    }, '*');
                } catch (e) {
                    // Игнорируем ошибки отправки
                }
            };

            ['log', 'error', 'warn', 'info', 'debug'].forEach(method => {
                console[method] = function(...args) {
                    try {
                        originalConsole[method].apply(console, args);
                    } catch (e) {}
                    
                    sendToConsole(method, args);
                };
            });

            window.addEventListener('error', function(e) {
                sendToConsole('error', ['Uncaught Error: ' + e.message]);
            });

        })();

        // Запускаем пользовательский код
        try {
            ${jsCode}
        } catch (e) {
            console.error('Execution error:', e);
        }
    <\/script>
</body>
</html>`;

                previewDoc.open();
                previewDoc.write(fullHtml);
                previewDoc.close();

                previewFullscreen.style.display = 'block';
                
                // Автоматически открываем консоль если есть JS код
                if (jsCode.trim()) {
                    setTimeout(() => {
                        consolePanel.classList.add('active');
                        consoleToggle.classList.add('active');
                    }, 500);
                }
            }

            // Обработка сообщений из iframe
            window.addEventListener('message', function(e) {
                if (e.data && e.data.type === 'console') {
                    consoleState.logs.push({
                        method: e.data.method,
                        args: e.data.args,
                        timestamp: Date.now()
                    });
                    updateConsole();
                }
            });

            // Управление консолью
            consoleToggle.addEventListener('click', function() {
                consolePanel.classList.toggle('active');
                this.classList.toggle('active');
            });

            clearConsole.addEventListener('click', function() {
                consoleState.logs = [];
                updateConsole();
            });

            copyConsole.addEventListener('click', copyConsoleText);

            // Закрытие превью
            closePreview.addEventListener('click', function() {
                previewFullscreen.style.display = 'none';
                consolePanel.classList.remove('active');
                consoleToggle.classList.remove('active');
            });

            // Горячие клавиши
            document.addEventListener('keydown', function(e) {
                if (e.ctrlKey && e.key === 'Enter') {
                    e.preventDefault();
                    runCode();
                }
                
                if (e.key === 'Escape' && previewFullscreen.style.display === 'block') {
                    previewFullscreen.style.display = 'none';
                }
            });

            // Кнопки очистки
            document.querySelectorAll('.clear-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const editor = this.getAttribute('data-editor');
                    const textarea = document.getElementById(editor + '-code');
                    if (textarea) {
                        textarea.value = '';
                        initializeEditor(editor);
                    }
                });
            });
        });
    </script>
</body>
</html>
